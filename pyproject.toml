[project]
name = "datatalk"
version = "0.1.0"
description = "Conversational Analytics Agent with self-correcting Text-to-SQL"
readme = "README.md"

authors = [
    { name = "ManarFR", email = "manarfekihromdhane@gmail.com" }
]

requires-python = ">=3.12,<3.14"

dependencies = [

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",

    # Configuration
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Agent framework
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # LLM providers
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",
    "langchain-ollama>=0.1.0",

    # Visualization
    "plotly>=5.24.0",
    "pandas>=2.2.0",

    # Frontend
    "streamlit>=1.38.0",

    # Utilities
    "python-multipart>=0.0.10",
    "httpx>=0.27.0",
]


[project.optional-dependencies]

dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]


[build-system]

requires = [
    "setuptools>=61.0",
    "wheel>=0.37.0"
]

build-backend = "setuptools.build_meta"


[tool.ruff]

line-length = 100
target-version = "py312"


[tool.pytest.ini_options]

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]